secrets:
  very_secret:
    file: ${EIAB_EXTRA:-.}/secrets/very_secret.txt
services:
  main-initialize:
    image: alpine:latest
    env_file:
      - ${EIAB_APP:+/image-build/eiab/tse}${EIAB_ENV:+.}/env/${EIAB_ENV:-prod}.env
    environment:
      # ===== .env file variables (automatically loaded) =====
      # Pattern 1: Empty value
      dotenv_empty:
      # Pattern 2: Substitution from .env
      dotenv_sub: "${dotenv_sub}"
      # Pattern 3: Hard-coded value
      dotenv_hard: "hard"
      # Pattern 4: Undeclared (dotenv_undeclared exists in .env but not declared here)
      
      # ===== stack.env file variables (explicitly loaded) =====
      # Pattern 1: Empty value
      stackenv_empty:
      # Pattern 2: Substitution from stack.env
      stackenv_sub: "${stackenv_sub}"
      # Pattern 3: Hard-coded value
      stackenv_hard: "hard"
      # Pattern 4: Undeclared (stackenv_undeclared exists in stack.env but not declared here)
      
      # ===== env/staging.env file variables (conditionally loaded) =====
      # Pattern 1: Empty value
      stagingenv_empty:
      # Pattern 2: Substitution from staging.env
      stagingenv_sub: "${stagingenv_sub}"
      # Pattern 3: Hard-coded value
      stagingenv_hard: "hard"
      # Pattern 4: Undeclared (stagingenv_undeclared exists in staging.env but not declared here)
      
      # ===== Portainer UI simulation variables =====
      # Pattern 1: Empty value
      portainer_empty:
      # Pattern 2: Substitution from portainer-simulation.env
      portainer_sub: "${portainer_sub}"
      # Pattern 3: Hard-coded value
      portainer_hard: "hard"
      # Pattern 4: Undeclared (portainer_undeclared exists in portainer-simulation.env but not declared here)
      
      # ===== Missing variable test (missing from ALL sources) =====
      # Pattern 5: Missing variable - not defined in any source
      missing_test: "${missing_var}"
    entrypoint: ["/bin/sh", "-c"]
    secrets:
      - very_secret
    volumes:
      - ${EIAB_APP:-.}/vols/scripts:/scripts
      - ${EIAB_EXTRA:-.}/vols/extras:/extras
    command: 
      - |
        printenv | sort
        echo "=== ENVIRONMENT VARIABLE TESTING ==="
        echo "=== .env file tests ==="
        echo "dotenv_empty: compose: '${dotenv_empty}' container env: '$$dotenv_empty'"
        echo "dotenv_sub: compose: '${dotenv_sub}' container env: '$$dotenv_sub'"
        echo "dotenv_hard: compose: '${dotenv_hard}' container env: '$$dotenv_hard'"
        echo "dotenv_undeclared: compose: '${dotenv_undeclared}' container env: '$$dotenv_undeclared' (exists in .env but not in environment section)"
        echo "=== stack.env file tests ==="
        echo "stackenv_empty: compose: '${stackenv_empty}' container env: '$$stackenv_empty'"
        echo "stackenv_sub: compose: '${stackenv_sub}' container env: '$$stackenv_sub'"
        echo "stackenv_hard: compose: '${stackenv_hard}' container env: '$$stackenv_hard'"
        echo "stackenv_undeclared: compose: '${stackenv_undeclared}' container env: '$$stackenv_undeclared' (exists in stack.env but not in environment section)"
        echo "=== env/staging.env file tests ==="
        echo "stagingenv_empty: compose: '${stagingenv_empty}' container env: '$$stagingenv_empty'"
        echo "stagingenv_sub: compose: '${stagingenv_sub}' container env: '$$stagingenv_sub'"
        echo "stagingenv_hard: compose: '${stagingenv_hard}' container env: '$$stagingenv_hard'"
        echo "stagingenv_undeclared: compose: '${stagingenv_undeclared}' container env: '$$stagingenv_undeclared' (exists in staging.env but not in environment section)"
        echo "=== Portainer UI simulation tests ==="
        echo "portainer_empty: compose: '${portainer_empty}' container env: '$$portainer_empty'"
        echo "portainer_sub: compose: '${portainer_sub}' container env: '$$portainer_sub'"
        echo "portainer_hard: compose: '${portainer_hard}' container env: '$$portainer_hard'"
        echo "portainer_undeclared: compose: '${portainer_undeclared}' container env: '$$portainer_undeclared' (exists in portainer-simulation.env but not in environment section)"
        echo "=== Missing variable test ==="
        echo "missing_test: compose: '${missing_test}' container env: '$$missing_test' (missing_var not defined in any source)"
        ls -l /scripts /extras
        echo "very_secret: $(cat /run/secrets/very_secret)"
        echo "compose: EIAB_APP=${EIAB_APP} EIAB_ENV=${EIAB_ENV} EIAB_EXTRA=${EIAB_EXTRA}"
