services:
  main-initialize:
    image: alpine:latest
    env_file:
      - ${EIAB_ENV:-stack}.env
    environment:
      env_stack_env1: "${env_stack_env1}"
      env_stack_env2:
      env_comp1:: 
      env_env1:
      env_env2: "${env_env2}"
      env_comp3:
      env_compdc1: "OU=Users,OU=compose"
    entrypoint: ["/bin/sh", "-xvc"]
    command: ['printenv; echo "compose: env_stack_env1=${env_stack_env1} env_stack_env2=${env_stack_env2} env_stack_env3=${env_stack_env3} env_comp1=${env_comp1} env_env2=${env_env2} env_comp3=${env_comp3} env_compdc1=${env_compdc1}";']
